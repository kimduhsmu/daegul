<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대걸 모임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #1a1f2e;
    --surface: #222840;
    --card: #252c40;
    --card-hover: #2d3550;
    --border: #2e3650;
    --accent: #4fd1a0;
    --accent2: #6c8ef5;
    --text: #e8eaf0;
    --text-sub: #a0a8c0;
    --muted: #606880;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    padding: 40px 24px 28px;
    text-align: center;
    position: relative;
  }

  .header-bg-text {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 52px;
    font-weight: 900;
    color: rgba(255,255,255,0.04);
    white-space: nowrap;
    letter-spacing: 4px;
    pointer-events: none;
    user-select: none;
  }

  header h1 {
    font-size: 34px;
    font-weight: 900;
    color: var(--text);
    position: relative;
    z-index: 1;
  }

  header h1 span { color: var(--accent); }

  .header-meta {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-sub);
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .header-meta .구분선 {
    width: 1px;
    height: 12px;
    background: var(--muted);
  }

  /* ── 메인 ── */
  main { padding: 16px 16px 80px; }

  /* ── 카드 그리드 ── */
  .모임그리드 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .모임카드 {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 16px 24px;
    cursor: pointer;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 160px;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
    position: relative;
    overflow: hidden;
  }

  .모임카드::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .모임카드:active {
    transform: scale(0.96);
    background: var(--card-hover);
    border-color: var(--accent);
  }

  .모임카드:active::before { opacity: 1; }

  .카드아이콘 {
    font-size: 32px;
    line-height: 1;
  }

  .카드회차 {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    background: rgba(79, 209, 160, 0.1);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(79, 209, 160, 0.2);
  }

  .카드날짜 {
    font-size: 19px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
  }

  .카드장소 {
    font-size: 13px;
    color: var(--text-sub);
    line-height: 1.4;
    word-break: keep-all;
  }

  .카드인원 {
    font-size: 12px;
    color: var(--muted);
  }

  /* ── 로딩 ── */
  .로딩 {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 15px;
    line-height: 2;
  }

  .스피너 {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 16px auto 0;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 페이지 전환 ── */
  .목록페이지.숨김 { display: none; }
  .상세페이지 { display: none; }
  .상세페이지.보임 { display: block; }

  /* ── 뒤로가기 ── */
  .뒤로가기 {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    width: 100%;
    margin-bottom: 14px;
    transition: border-color 0.15s, background 0.15s;
  }

  .뒤로가기:active {
    background: var(--card-hover);
    border-color: var(--accent);
  }

  /* ── 상세 카드 ── */
  .상세카드 {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 10px;
  }

  .라벨 {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .상세날짜 {
    font-size: 28px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .상세시간 {
    font-size: 16px;
    color: var(--text-sub);
  }

  .상세장소텍스트 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .참석자목록 {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .참석자태그 {
    background: rgba(108, 142, 245, 0.12);
    border: 1px solid rgba(108, 142, 245, 0.3);
    color: var(--accent2);
    font-size: 16px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 30px;
  }

  .내용텍스트 {
    font-size: 17px;
    color: var(--text-sub);
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: keep-all;
  }

  .사진그리드 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .사진그리드 img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: opacity 0.15s;
  }

  .사진그리드 img:active { opacity: 0.7; }

  .빈메시지 {
    font-size: 14px;
    color: var(--muted);
  }

  /* ── 라이트박스 ── */
  .라이트박스 {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.96);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }

  .라이트박스.보임 { display: flex; }

  .라이트박스 img {
    max-width: 95vw;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 8px;
  }

  .닫기버튼 {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    font-size: 22px;
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── 푸터 ── */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="header-bg-text">대걸모임</div>
  <h1>대<span>걸</span> 모임</h1>
  <div class="header-meta">
    <span>우리들의 모임 기록</span>
  </div>
</header>

<main>
  <div class="목록페이지" id="목록페이지">
    <div class="로딩" id="로딩">
      불러오는 중...
      <div class="스피너"></div>
    </div>
  </div>

  <div class="상세페이지" id="상세페이지">
    <button class="뒤로가기" onclick="목록으로()">← 목록으로 돌아가기</button>
    <div id="상세내용"></div>
  </div>
</main>

<div class="라이트박스" id="라이트박스" onclick="라이트박스닫기()">
  <button class="닫기버튼" onclick="라이트박스닫기(); event.stopPropagation();">✕</button>
  <img id="라이트박스이미지" src="" alt="모임 사진">
</div>

<footer>대걸 모임 © 2026</footer>

<script>
  const SHEET_ID = '1dEwzHzxFYrc9q5v8zqpmVvEfR-F0or2k17Gm97aK-M8';
  const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  // 회차별 아이콘 순환
  const 아이콘목록 = ['🍻','🍖','🎉','🍜','⛳','🎲','🥂','🎤','🏖️','🎊'];

  let 모임목록 = [];

  async function 데이터불러오기() {
    try {
      const res = await fetch(DATA_URL);
      const text = await res.text();
      const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
      const rows = json.table.rows;

      모임목록 = rows
        .filter(r => r.c && r.c[0] && r.c[0].v)
        .map((r, i) => {
          const 셀 = idx => (r.c[idx] && r.c[idx].v != null) ? String(r.c[idx].v).trim() : '';
          // F열(5): 드라이브 공유링크, G열(6): 변환된 이미지링크 - 둘 다 지원
          const 사진링크 = 셀(6) || 셀(5);
          return {
            번호: i + 1,
            날짜: 셀(0),
            시간: 셀(1),
            장소: 셀(2),
            참석자: 셀(3) ? 셀(3).split(',').map(s => s.trim()).filter(Boolean) : [],
            내용: 셀(4),
            사진: 사진링크 ? 사진링크.split(',').map(s => s.trim()).filter(Boolean) : [],
            아이콘: 아이콘목록[i % 아이콘목록.length]
          };
        });

      목록렌더링();
    } catch (e) {
      document.getElementById('로딩').innerHTML =
        `<div style="color:#ff6b6b;font-size:15px;line-height:2">
          데이터를 불러오지 못했어요<br>
          <small style="font-size:12px;color:#606880">${e.message}</small>
        </div>`;
    }
  }

  function 목록렌더링() {
    const 목록 = document.getElementById('목록페이지');

    if (모임목록.length === 0) {
      목록.innerHTML = `
        <div class="로딩">
          아직 기록된 모임이 없어요<br>
          <small style="font-size:13px">구글 시트에 내용을 입력해 주세요</small>
        </div>`;
      return;
    }

    const 그리드 = document.createElement('div');
    그리드.className = '모임그리드';

    모임목록.forEach((m, i) => {
      const 카드 = document.createElement('div');
      카드.className = '모임카드';
      const 날짜표시 = m.날짜.replace(/^20\d\d\./, '');
      카드.innerHTML = `
        <div class="카드아이콘">${m.아이콘}</div>
        <div class="카드회차">${String(m.번호).padStart(2,'0')}회</div>
        <div class="카드날짜">${날짜표시}</div>
        <div class="카드장소">${m.장소 || '-'}</div>
        <div class="카드인원">👥 ${m.참석자.length}명</div>
      `;
      카드.onclick = () => 상세보기(i);
      그리드.appendChild(카드);
    });

    목록.innerHTML = '';
    목록.appendChild(그리드);
  }

  function 상세보기(idx) {
    const m = 모임목록[idx];

    const 참석자HTML = m.참석자.length
      ? `<div class="참석자목록">${m.참석자.map(a => `<span class="참석자태그">${a}</span>`).join('')}</div>`
      : '<div class="빈메시지">-</div>';

    const 사진HTML = m.사진.length
      ? `<div class="사진그리드">${m.사진.map(p =>
          `<img src="${p}" alt="모임 사진" onclick="라이트박스열기('${p}'); event.stopPropagation();">`
        ).join('')}</div>`
      : '<div class="빈메시지">등록된 사진이 없어요</div>';

    document.getElementById('상세내용').innerHTML = `
      <div class="상세카드">
        <div class="라벨">📅 날짜 / 시간</div>
        <div class="상세날짜">${m.날짜}</div>
        <div class="상세시간">${m.시간}</div>
      </div>

      <div class="상세카드">
        <div class="라벨">📍 장소</div>
        <div class="상세장소텍스트">${m.장소 || '-'}</div>
      </div>

      <div class="상세카드">
        <div class="라벨">👥 참석자</div>
        ${참석자HTML}
      </div>

      <div class="상세카드">
        <div class="라벨">📝 내용</div>
        <div class="내용텍스트">${m.내용 || '내용이 없어요'}</div>
      </div>

      <div class="상세카드">
        <div class="라벨">📷 사진</div>
        ${사진HTML}
      </div>
    `;

    document.getElementById('목록페이지').classList.add('숨김');
    document.getElementById('상세페이지').classList.add('보임');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function 목록으로() {
    document.getElementById('목록페이지').classList.remove('숨김');
    document.getElementById('상세페이지').classList.remove('보임');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function 라이트박스열기(src) {
    document.getElementById('라이트박스이미지').src = src;
    document.getElementById('라이트박스').classList.add('보임');
  }

  function 라이트박스닫기() {
    document.getElementById('라이트박스').classList.remove('보임');
  }

  데이터불러오기();
</script>
</body>
</html>
